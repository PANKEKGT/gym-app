{% extends "base.html" %}
{% set active_page = "payments" %}
{% block content %}
<div class="form-card">
  <h2>💳 Ödeme Ekle</h2>
  <form method="post">
    <div class="form-group">
      <label>Öğrenci *</label>
      <select name="student_id" required>
        {% for s in students %}
          <option value="{{ s.id }}">{{ s.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tutar (₺) *</label>
        <input type="number" name="amount" step="0.01" min="0" required>
      </div>
      <div class="form-group">
        <label>Ay (YYYY-AA)</label>
        <input type="month" name="month" value="{{ current_month }}">
      </div>
    </div>
    <div class="form-group">
      <label>Not</label>
      <input type="text" name="note" placeholder="ör: Mayıs ödemesi">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-green">💾 Kaydet</button>
      <a href="/payments" class="btn btn-gray">İptal</a>
    </div>
  </form>
</div>
{% endblock %}
